<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#020917"/>
<title>BioAttend · Offline</title>
<style>
:root{
  --bg:#020917;--surface:#0b1530;--text:#eef2ff;--muted:#64748b;
  --acc:#4f6ef7;--acc2:#7c3aed;--border:rgba(99,130,255,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;
}
.icon{
  width:72px;height:72px;border-radius:22px;margin-bottom:20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(79,110,247,.35);
}
.icon svg{width:34px;height:34px;stroke:#fff;}
h1{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.3px;}
p{font-size:13px;color:var(--muted);line-height:1.6;max-width:320px;margin-bottom:22px;}
button{
  padding:12px 22px;border:none;border-radius:10px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;
}
.hint{margin-top:16px;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>BioAttend needs a connection to load for the first time. Once you've opened it once, attendance you mark while offline will be queued and synced automatically when you're back online.</p>
  <button onclick="location.reload()">Try Again</button>
  <div class="hint">BioAttend · NIT Meghalaya</div>
</body>
</html>
